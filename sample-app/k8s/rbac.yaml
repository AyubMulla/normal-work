apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app-sa
  namespace: sample-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sample-app-role
  namespace: sample-app
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sample-app-rolebinding
  namespace: sample-app
subjects:
  - kind: ServiceAccount
    name: sample-app-sa
    namespace: sample-app
roleRef:
  kind: Role
  name: sample-app-role
  apiGroup: rbac.authorization.k8s.io

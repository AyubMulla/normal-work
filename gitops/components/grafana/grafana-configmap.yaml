apiVersion: v1
kind: ConfigMap
metadata:
  name: lgtm-grafana-datasources
  labels:
    grafana_datasource: "1"
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: http://prometheus-local:9090
        isDefault: true
        editable: false

apiVersion: v1
kind: Service
metadata:
  name: loki-local
spec:
  ports:
  - port: 3100
    targetPort: 3100
  selector:
    app: loki-local

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-local
  template:
    metadata:
      labels:
        app: loki-local
    spec:
      containers:
      - name: loki
        image: grafana/loki:2.8.2
        args:
        - -config.file=/etc/loki/local-config.yaml
        ports:
        - containerPort: 3100
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: wal
          mountPath: /wal
      volumes:
      - name: config
        configMap:
          name: loki-local-config
      - name: wal
        emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-local-config
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    ingester:
      wal:
        enabled: true
        dir: /wal
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/index
        shared_store: filesystem
        cache_location: /loki/cache
      filesystem:
        directory: /loki/chunks

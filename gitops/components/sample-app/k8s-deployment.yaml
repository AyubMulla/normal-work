apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      serviceAccountName: sample-app-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: sample-app
        image: localhost:5000/sample-app:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: sample-app

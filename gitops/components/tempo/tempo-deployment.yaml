apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
      - name: tempo
        image: grafana/tempo:2.9.0
        args:
        - -target=all
        ports:
        - containerPort: 14268

---
apiVersion: v1
kind: Service
metadata:
  name: lgtm-tempo
spec:
  ports:
  - port: 14268
    targetPort: 14268
  selector:
    app: tempo

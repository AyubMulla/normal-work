apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgtm-tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: "1.24.4"
    helm:
      values: |
        tempo:
          storage:
            trace:
              backend: local
              local:
                path: /var/tempo/traces

        persistence:
          enabled: true
          size: 10Gi

        receiver:
          otlp:
            protocols:
              http: true
              grpc: true

        metricsGenerator:
          enabled: true
          config:
            processor:
              service_graphs:
                dimensions: []
              span_metrics:
                dimensions: []
  destination:
    server: https://kubernetes.default.svc
    namespace: lgtm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

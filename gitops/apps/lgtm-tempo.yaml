apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgtm-tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/AyubMulla/normal-work"
    path: gitops/components/tempo
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: lgtm
  syncPolicy:
    automated: {}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgtm-tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: "*"
    helm:
      values: |
        persistence:
          enabled: true
          size: 10Gi
        receiver:
          otlp:
            protocols:
              http: true
              grpc: true
  destination:
    server: https://kubernetes.default.svc
    namespace: lgtm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

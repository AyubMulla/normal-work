apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgtm-namespace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/AyubMulla/normal-work"
    path: gitops/components/namespaces/lgtm-namespace.yaml
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: lgtm
  syncPolicy:
    automated: {}

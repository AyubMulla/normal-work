apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgtm-prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/AyubMulla/normal-work"
    path: gitops/components/prometheus
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: lgtm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

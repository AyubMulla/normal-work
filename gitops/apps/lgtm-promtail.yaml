apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgtm-promtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: promtail
    targetRevision: "6.17.1"
    helm:
      values: |
        config:
          clients:
            - url: http://loki-local.lgtm.svc.cluster.local:3100/loki/api/v1/push
  destination:
    server: https://kubernetes.default.svc
    namespace: lgtm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

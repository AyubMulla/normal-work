apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lgtm-temporal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AyubMulla/normal-work
    path: gitops/temporal
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    automated: {}
    syncOptions:
      - Replace=true
